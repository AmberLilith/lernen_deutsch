<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vocabulário: Substantivos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="nav">
            <a class="brand" href="../index.html">Alemão <small>estudos</small></a>
            <div class="nav-links">
                <a href="../index.html#conteudos">Conteúdos</a>
                <a href="../index.html#exercicios">Exercícios</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="breadcrumb">
            <a href="../index.html">Início</a> / Vocabulário
        </div>

        <div class="hero">
            <div class="eyebrow">Vocabulário</div>
            <h1>Vocabulário acumulado</h1>
            <p class="lead">
                Um lugar para reunir palavras novas e revisar sem precisar procurar em conversas antigas.
            </p>
        </div>

        <div class="panel" style="position: relative;">
            <div class="search-field">
                <input type="search" id="busca" class="input-search" placeholder="Buscar por tradução em português..." autocomplete="off">
                <span id="buscaResultado" class="search-result-count"></span>
            </div>

            <div class="grid" id="vocabulario"></div>

            <div class="pagination" id="paginacao">
                <button type="button" id="anterior">← Anterior</button>
                <span id="paginaAtual"></span>
                <button type="button" id="proxima">Próxima →</button>
            </div>
        </div>

        <div class="panel">
            <h2>Exercícios relacionados</h2>
            <div class="exercise-list">
                <a class="exercise-link" href="../exercicios/vocabulario_substantivos/vocabulario_substantivos.html">
                    <span>Praticar: Vocabulário acumulado</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>

        <div class="lesson-nav"></div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>Material de estudo pessoal</span>
            <a href="../index.html">← Início</a>
        </div>
    </footer>

    <script type="module">
        import { database } from "../js/firebase.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

        let substantivos = [];
        const cardsPorPagina = 12;
        let paginaAtual = 1;

        const container = document.getElementById("vocabulario");
        const botaoAnterior = document.getElementById("anterior");
        const botaoProxima = document.getElementById("proxima");
        const indicadorPagina = document.getElementById("paginaAtual");
        const paginacao = document.getElementById("paginacao");
        const campoBusca = document.getElementById("busca");
        const buscaResultado = document.getElementById("buscaResultado");

        function criarCard(item) {
            const card = document.createElement("div");
            card.className = "card";
            const generoOposto = item.artigo === "der" ? "Feminino" : "Masculino";

            const titulo = document.createElement("h3");
            titulo.textContent = `${item.artigo} ${item.substantivo}`;

            const descricao = document.createElement("p");
            descricao.innerHTML = `<strong>Tradução:</strong> ${item.traducao}`;

            const pluralElement = document.createElement("p");
            pluralElement.innerHTML = `<strong>Plural:</strong> ${item.plural}`;

            const generoOpostoElement = document.createElement("p");
            const pluralGeneroOpostoElement = document.createElement("p");

            if (generoOposto !== "Neutro" && item.generoOposto) {
                generoOpostoElement.innerHTML = `<strong>${generoOposto}:</strong> ${item.generoOposto}`;
                pluralGeneroOpostoElement.innerHTML = `<strong>Plural ${generoOposto}:</strong> ${item.pluralGeneroOposto}`;
            }

            const obs = document.createElement("p");
            obs.innerHTML = item.observacao ? `<strong>Obs.:</strong> ${item.observacao}` : "";

            card.appendChild(titulo);
            card.appendChild(descricao);
            card.appendChild(pluralElement);
            card.appendChild(generoOpostoElement);
            card.appendChild(pluralGeneroOpostoElement);
            card.appendChild(obs);

            return card;
        }

        function normalizar(texto) {
            return (texto || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "");
        }

        function exibirPagina(pagina) {
            container.innerHTML = "";

            const totalPaginas = Math.ceil(substantivos.length / cardsPorPagina);
            const inicio = (pagina - 1) * cardsPorPagina;
            const fim = inicio + cardsPorPagina;

            substantivos.slice(inicio, fim).forEach(item => {
                container.appendChild(criarCard(item));
            });

            indicadorPagina.textContent = `Página ${pagina} de ${totalPaginas}`;
            botaoAnterior.disabled = pagina === 1;
            botaoProxima.disabled = pagina === totalPaginas;
        }

        function exibirBusca(termo) {
            const termoNormalizado = normalizar(termo);

            const resultados = substantivos.filter(item => {
                const traducaoOk = normalizar(item.traducao).includes(termoNormalizado);
                const substantivoOk = normalizar(item.substantivo).includes(termoNormalizado);
                return traducaoOk || substantivoOk;
            });

            container.innerHTML = "";

            if (resultados.length === 0) {
                const vazio = document.createElement("p");
                vazio.className = "search-empty";
                vazio.textContent = "Nenhuma palavra encontrada.";
                container.appendChild(vazio);
            } else {
                resultados.forEach(item => container.appendChild(criarCard(item)));
            }

            buscaResultado.textContent =
                `${resultados.length} resultado${resultados.length === 1 ? "" : "s"}`;
        }

        campoBusca.addEventListener("input", () => {
            const termo = campoBusca.value.trim();

            if (termo === "") {
                buscaResultado.textContent = "";
                paginacao.style.display = "";
                exibirPagina(paginaAtual);
            } else {
                paginacao.style.display = "none";
                exibirBusca(termo);
            }
        });

        botaoAnterior.addEventListener("click", () => {
            if (paginaAtual > 1) {
                paginaAtual--;
                exibirPagina(paginaAtual);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        });

        botaoProxima.addEventListener("click", () => {
            const totalPaginas = Math.ceil(substantivos.length / cardsPorPagina);

            if (paginaAtual < totalPaginas) {
                paginaAtual++;
                exibirPagina(paginaAtual);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        });

        async function carregarSubstantivos() {
            try {
                const snapshot = await get(ref(database, "substantivos"));

                if (!snapshot.exists()) {
                    throw new Error("O nó 'substantivos' não possui dados.");
                }

                const dados = snapshot.val();

                substantivos = Object.entries(dados).map(([substantivo, dadosSubstantivo]) => ({
                    substantivo,
                    ...dadosSubstantivo
                }));

                exibirPagina(paginaAtual);
            } catch (error) {
                console.error("Não foi possível carregar os substantivos do Firebase:", error);
                container.innerHTML = "<p class=\"search-empty\">Não foi possível carregar o vocabulário.</p>";
                paginacao.style.display = "none";
            }
        }

        carregarSubstantivos();
    </script>
</body>

</html>
