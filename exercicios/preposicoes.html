<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preposições · Alemão</title><link rel="stylesheet" href="../css/style.css"><style>#panel{position:relative}#exercicios-scroll{height:calc(100vh - 180px);overflow-y:auto;padding-bottom:90px}#exercicios{display:flex;flex-direction:column;gap:10px}.question{padding:14px 16px;border-radius:6px;background:#fafafa;border:1px solid #e5e5e5}.prompt{font-weight:600;line-height:1.6;margin-bottom:10px}.answer-input{width:min(100%,760px);font-size:16px;padding:9px 10px;border:1px solid #aaa;border-radius:4px}.feedback{display:inline-block;margin-left:8px;font-weight:bold}.feedback.correct{color:#2e7d32}.feedback.incorrect{color:#c62828}.answer-btn{margin-left:10px;padding:6px 10px;background:#eee;color:#333;border:0;border-radius:5px;cursor:pointer;font-size:13px}.correct-answer{display:none;margin-top:8px;padding-left:2px;color:#555;font-style:italic}.correct-answer.visible{display:block}#pontuacao{display:none;margin-top:18px;font-weight:bold;font-size:18px}#maisExercicios{display:block;margin:25px auto 10px;padding:10px 18px;background:#333;color:white;border:0;border-radius:5px;cursor:pointer;font-size:15px}#maisExercicios:disabled{background:#aaa;cursor:default}#fimLista{text-align:center;margin-top:10px;color:#666;font-weight:bold}.controls{position:absolute;bottom:0;left:0;width:100%;display:flex;gap:10px;padding:12px 0;background:#f4f1e8;border-top:1px solid #d8d2c4;z-index:10}.controls button{flex:1;padding:10px 18px;border:0;border-radius:5px;cursor:pointer;font-size:15px}#corrigir{background:#333;color:white}#resetar{background:#ddd;color:#222}@media(max-width:600px){#exercicios-scroll{height:calc(100vh - 160px)}.answer-input{width:100%}.answer-btn{margin:8px 0 0}}</style></head><body><header class="site-header"><nav class="nav"><a class="brand" href="../index.html">Alemão <small>estudos</small></a><div class="nav-links"><a href="../index.html#conteudos">Conteúdos</a><a href="../index.html#exercicios">Exercícios</a></div></nav></header><main class="container"><div class="breadcrumb"><a href="../index.html">Início</a> / Exercícios</div><div class="hero"><div class="eyebrow">Exercício</div><h1>Preposições</h1><p class="lead">Pratique preposições, casos e relações de lugar. Os exercícios são embaralhados ao carregar a página.</p></div><div class="panel" id="panel"><div class="progress"><span></span></div><div id="exercicios-scroll"><div id="exercicios"></div><div id="pontuacao" class="score"></div><button type="button" id="maisExercicios">Exibir mais 10</button><div id="fimLista"></div></div><div class="controls"><button type="button" id="corrigir">Corrigir</button><button type="button" id="resetar">Resetar</button></div></div></main><footer class="site-footer"><div class="footer-inner"><span>Material de estudo pessoal</span><a href="../index.html">← Início</a></div></footer><script>
const exercicios=[[1,'Nós fazemos isso pelo vizinho.','Wir machen das für den Nachbarn.'],[2,'Ele caminha através da floresta.','Er geht durch den Wald.'],[3,'Ela é contra isso.','Sie ist dagegen.'],[4,'Eu vou sem o celular.','Ich gehe ohne das Handy.'],[5,'Nós chegamos às 7h.','Wir kommen um 7 Uhr an.'],[6,'Eu venho da farmácia.','Ich komme aus der Apotheke.'],[7,'Ela mora na casa do tio.','Sie wohnt im Haus des Onkels.'],[8,'Nós vamos com o chefe.','Wir gehen mit dem Chef.'],[9,'Ele viaja para a Alemanha depois do trabalho.','Er reist nach Deutschland nach der Arbeit.'],[10,'Eu moro aqui desde um ano.','Ich wohne hier seit einem Jahr.'],[11,'Isso é do estudante.','Das ist vom Studenten.'],[12,'Ela vai à igreja.','Sie geht in die Kirche.'],[13,'O relógio está na mesa.','Die Uhr liegt auf dem Tisch.'],[14,'O pássaro está na árvore. (árvore = der Baum)','Der Vogel ist auf dem Baum.'],[15,'A lâmpada está perto da cama.','Die Lampe ist neben dem Bett.'],[16,'O carro está na frente da loja.','Das Auto steht vor dem Laden.'],[17,'O gato está atrás do sofá.','Die Katze ist hinter dem Sofa.'],[18,'O tapete está debaixo da mesa.','Der Teppich liegt unter dem Tisch.'],[19,'A lâmpada está sobre a mesa.','Die Lampe hängt über dem Tisch.'],[20,'A cadeira está entre a cama e o armário.','Der Stuhl ist zwischen dem Bett und dem Schrank.'],[21,'Ela coloca o relógio na mesa. (colocar, deitado = legen)','Sie legt die Uhr auf den Tisch.'],[22,'O pássaro voa para a árvore. (voar = fliegen)','Der Vogel fliegt auf den Baum.'],[23,'Ele coloca a lâmpada perto da cama. (colocar, de pé = stellen)','Er stellt die Lampe neben das Bett.'],[24,'Ela estaciona o carro na frente da loja. (estacionar = parken)','Sie parkt das Auto vor dem Laden.'],[25,'O gato vai para trás do sofá.','Die Katze geht hinter das Sofa.'],[26,'Ele coloca o tapete debaixo da mesa.','Er legt den Teppich unter den Tisch.'],[27,'Ela pendura a lâmpada sobre a mesa. (pendurar = hängen)','Sie hängt die Lampe über den Tisch.'],[28,'Ele coloca a cadeira entre a cama e o armário.','Er stellt den Stuhl zwischen das Bett und den Schrank.'],[29,'Nós estamos em casa desde a manhã.','Wir sind seit dem Morgen zu Hause.'],[30,'Ela vai ao médico sem o celular.','Sie geht ohne das Handy zum Arzt.'],[31,'Ele mora na casa do vizinho há um ano.','Er wohnt seit einem Jahr im Haus des Nachbarn.'],[32,'O espelho está na parede. (parede = die Wand)','Der Spiegel hängt an der Wand.'],[33,'Ela pendura o espelho na parede.','Sie hängt den Spiegel an die Wand.'],[34,'Nós caminhamos através da cidade.','Wir gehen durch die Stadt.'],[35,'Isso é para o chefe.','Das ist für den Chef.'],[36,'Ele vem do hospital.','Er kommt aus dem Krankenhaus.'],[37,'O sapato está debaixo da cama.','Der Schuh liegt unter dem Bett.'],[38,'Ela coloca o sapato debaixo da cama.','Sie stellt den Schuh unter das Bett.'],[39,'Nós vamos para a farmácia com o vizinho.','Wir gehen mit dem Nachbarn zur Apotheke.'],[40,'Ele está contra a ideia. (ideia = die Idee)','Er ist gegen die Idee.'],[41,'Ontem eu fui ao médico sem o vizinho, porque ele estava trabalhando.','Gestern bin ich ohne den Nachbarn zum Arzt gegangen, weil er gearbeitet hat.'],[42,'O carro está na frente da casa, e a bicicleta está atrás da casa.','Das Auto steht vor dem Haus, und das Fahrrad steht hinter dem Haus.'],[43,'Ela pendurou o quadro na parede e colocou o tapete debaixo da mesa. (quadro = das Bild)','Sie hat das Bild an die Wand gehängt und den Teppich unter den Tisch gelegt.'],[44,'Nós moramos na cidade há três anos, perto do hospital.','Wir wohnen seit drei Jahren in der Stadt, in der Nähe des Krankenhauses.']];
const vocab=[['Schrank','der','armário','o','Wand','die','parede','an','obj'],['Kommode','die','cômoda','a','Schrank','der','armário','neben','obj'],['Regal','das','estante','a','Wand','die','parede','an','obj'],['Balkon','der','varanda','a','Haus','das','casa','an','place','auf'],['Keller','der','porão','o','Haus','das','casa','in','place','in'],['Bibliothek','die','biblioteca','a','Universität','die','universidade','in','place','in'],['Klassenzimmer','das','sala de aula','a','Schule','die','escola','in','place','in'],['Parkplatz','der','estacionamento','o','Supermarkt','der','supermercado','vor','place','auf'],['Schublade','die','gaveta','a','Kommode','die','cômoda','in','obj'],['Vorhang','der','cortina','a','Fenster','das','janela','vor','obj'],['Matratze','die','colchão','o','Bett','das','cama','auf','obj'],['Vase','die','vaso','o','Tisch','der','mesa','auf','obj'],['Teppich','der','tapete','o','Sofa','das','sofá','vor','obj'],['Decke','die','cobertor','o','Bett','das','cama','auf','obj'],['Kissen','das','almofada','a','Bett','das','cama','auf','obj'],['Wand','die','parede','a','Zimmer','das','cômodo','in','obj'],['Tür','die','porta','a','Zimmer','das','cômodo','in','obj'],['Fenster','das','janela','a','Wand','die','parede','an','obj'],['Dach','das','telhado','o','Haus','das','casa','auf','obj'],['Treppenhaus','das','escadaria','a','Wohnhaus','das','prédio residencial','in','place','in'],['Flur','der','corredor','o','Wohnung','die','apartamento','in','place','in'],['Korridor','der','corredor','o','Klassenzimmer','das','sala de aula','vor','place','in'],['Schreibtisch','der','escrivaninha','a','Fenster','das','janela','neben','obj'],['Sessel','der','poltrona','a','Sofa','das','sofá','neben','obj'],['Sofa','das','sofá','o','Wohnzimmer','das','sala de estar','in','obj'],['Bett','das','cama','a','Schlafzimmer','das','quarto','in','obj'],['Schlafzimmer','das','quarto','o','Wohnung','die','apartamento','in','place','in'],['Wohnzimmer','das','sala de estar','a','Wohnung','die','apartamento','in','place','in'],['Küche','die','cozinha','a','Wohnung','die','apartamento','in','place','in'],['Garage','die','garagem','a','Haus','das','casa','neben','place','in'],['Hof','der','pátio','o','Haus','das','casa','hinter','place','auf'],['Garten','der','jardim','o','Haus','das','casa','hinter','place','in'],['Brunnen','der','fonte','a','Garten','der','jardim','in','obj'],['Museum','das','museu','o','Rathaus','das','prefeitura','neben','place','in'],['Bahnhof','der','estação de trem','a','Stadt','die','cidade','in','place','zu'],['Haltestelle','die','parada','a','Bahnhof','der','estação de trem','vor','place','zu'],['Flughafen','der','aeroporto','o','Stadt','die','cidade','in','place','zu'],['Supermarkt','der','supermercado','o','Bäckerei','die','padaria','neben','place','in'],['Bäckerei','die','padaria','a','Supermarkt','der','supermercado','neben','place','in'],['Rathaus','das','prefeitura','a','Museum','das','museu','neben','place','in']];
const caso={der:{dat:'dem',akk:'den'},die:{dat:'der',akk:'die'},das:{dat:'dem',akk:'das'}};
function contrair(prep,art){const m={'an dem':'am','an das':'ans','in dem':'im','in das':'ins','von dem':'vom','zu dem':'zum','zu der':'zur'};return m[`${prep} ${art}`]||`${prep} ${art}`}
function prep(p,a,n,c){return contrair(p,caso[a][c])+' '+n}
function artigo(a,c){return caso[a][c]}
function relacaoPT(r){return ({neben:'ao lado de',vor:'na frente de',hinter:'atrás de',unter:'debaixo de',über:'sobre',zwischen:'entre',an:'junto a',in:'em',auf:'sobre'})[r]||r}
function gerarNovos(){let id=45;vocab.forEach(v=>{const[n,a,pt,ptArt,cn,ca,cpt,rel,tipo,direcao]=v;const alvo=`${a} ${n}`,ctx=`${ca} ${cn}`,notaPT=`(${pt} = ${alvo}; ${cpt} = ${ctx})`,notaDE=`(${alvo} = ${pt}; ${ctx} = ${cpt})`,pDat=prep(rel,ca,cn,'dat'),pAkk=prep(rel,ca,cn,'akk'),locVerb=['Vorhang','Fenster'].includes(n)?'hängt':(['Matratze','Decke','Kissen','Teppich','Vase'].includes(n)?'liegt':'steht'),moveVerb=['Matratze','Decke','Kissen','Teppich','Vase'].includes(n)?'legen':(['Vorhang','Fenster'].includes(n)?'hängen':'stellen'),moveIch=moveVerb==='legen'?'lege':moveVerb==='stellen'?'stelle':'hänge';exercicios.push([id++,`${ptArt} ${pt} está ${relacaoPT(rel)} ${cptArt} ${cpt}. ${notaPT}`,`${alvo} ${locVerb} ${pDat}.`]);exercicios.push([id++,`${alvo} ${locVerb} ${pDat}. ${notaDE}`,`${ptArt} ${pt} está ${relacaoPT(rel)} ${cptArt} ${cpt}.`]);exercicios.push([id++,`${alvo} ${locVerb} ___ ${ctx}. (complete com a preposição + artigo; ${relacaoPT(rel)} ${cpt}; ${notaDE})`,pDat]);if(tipo==='place'){const destino=contrair(direcao||'in',artigo(a,'akk'))+' '+n;exercicios.push([id++,`Eu vou para ${ptArt} ${pt}. ${notaPT}`,`Ich gehe ${destino}.`]);exercicios.push([id++,`Complete para indicar direção: Ich gehe ___ ${n}. (${pt} = ${pt})`,destino.replace(` ${n}`,'')]);}else{exercicios.push([id++,`Coloque ${ptArt} ${pt} ${relacaoPT(rel)} ${cptArt} ${cpt}. ${notaPT}`,`Ich ${moveIch} ${artigo(a,'akk')} ${n} ${pAkk}.`]);exercicios.push([id++,`Transforme para indicar ação/direção, usando "ich": ${alvo} ${locVerb} ${pDat}. ${notaDE}`,`Ich ${moveIch} ${artigo(a,'akk')} ${n} ${pAkk}.`]);}})}
gerarNovos();let exibidos=0,embaralhados=[];const porPagina=10;function embaralhar(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function normalizar(t){return t.trim().toLocaleLowerCase('de-DE').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}function criar(item,num){const q=document.createElement('div');q.className='question';q.dataset.id=embaralhados.indexOf(item);const p=document.createElement('div');p.className='prompt';p.append(document.createTextNode(`${num}. ${item[1]} `));const b=document.createElement('button');b.className='answer-btn';b.type='button';b.textContent='Ver resposta';const r=document.createElement('div');r.className='correct-answer';r.textContent=`Resposta: ${item[2]}`;b.onclick=()=>{r.classList.toggle('visible');b.textContent=r.classList.contains('visible')?'Ocultar resposta':'Ver resposta'};p.append(b);const input=document.createElement('input');input.className='answer-input';input.type='text';input.autocomplete='off';input.placeholder='Digite sua resposta...';const f=document.createElement('span');f.className='feedback';q.append(p,input,f,r);return q}function mostrar(){const fim=Math.min(exibidos+porPagina,embaralhados.length),c=document.getElementById('exercicios');for(let i=exibidos;i<fim;i++)c.appendChild(criar(embaralhados[i],i+1));exibidos=fim;document.getElementById('maisExercicios').disabled=exibidos>=embaralhados.length;document.getElementById('fimLista').textContent=exibidos>=embaralhados.length?'A lista de exercícios chegou ao fim.':''}function corrigir(){let acertos=0;document.querySelectorAll('.question').forEach(q=>{const item=embaralhados[+q.dataset.id],input=q.querySelector('.answer-input'),f=q.querySelector('.feedback'),ok=normalizar(input.value)===normalizar(item[2]);input.style.borderColor=ok?'#4caf50':'#e05252';f.textContent=ok?'✓ Correto':'✗ Incorreta';f.className=`feedback ${ok?'correct':'incorrect'}`;if(ok)acertos++});const total=document.querySelectorAll('.question').length,s=document.getElementById('pontuacao');s.textContent=`Resultado: ${acertos} de ${total} questões corretas.`;s.style.display='block'}function resetar(){document.getElementById('exercicios').innerHTML='';document.getElementById('pontuacao').style.display='none';exibidos=0;mostrar()}document.getElementById('corrigir').onclick=corrigir;document.getElementById('resetar').onclick=resetar;document.getElementById('maisExercicios').onclick=mostrar;embaralhados=embaralhar(exercicios);mostrar();
</script></body></html>
