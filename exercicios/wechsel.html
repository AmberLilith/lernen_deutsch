<!doctype html>

<style>
#panel{position:relative}#exercicios-scroll{height:calc(100vh - 180px);overflow-y:auto;padding-bottom:90px}#exercicios{display:flex;flex-direction:column;gap:10px}.question{padding:14px 16px;border-radius:6px;background:#fafafa;border:1px solid #e5e5e5}.prompt{font-weight:600;line-height:1.6;margin-bottom:10px}.answer-input{width:min(100%,760px);font-size:16px;padding:9px 10px;border:1px solid #aaa;border-radius:4px}.feedback{display:inline-block;margin-left:8px;font-weight:bold}.feedback.correct{color:#2e7d32}.feedback.incorrect{color:#c62828}.answer-btn{margin-left:10px;padding:6px 10px;background:#eee;color:#333;border:0;border-radius:5px;cursor:pointer;font-size:13px}.correct-answer{display:none;margin-top:8px;padding-left:2px;color:#555;font-style:italic}.correct-answer.visible{display:block}#pontuacao{display:none;margin-top:18px;font-weight:bold;font-size:18px}#maisExercicios{display:block;margin:25px auto 10px;padding:10px 18px;background:#333;color:white;border:0;border-radius:5px;cursor:pointer;font-size:15px}#maisExercicios:disabled{background:#aaa;cursor:default}#fimLista{text-align:center;margin-top:10px;color:#666;font-weight:bold}.controls{position:absolute;bottom:0;left:0;width:100%;display:flex;gap:10px;padding:12px 0;background:#f4f1e8;border-top:1px solid #d8d2c4;z-index:10}.controls button{flex:1;padding:10px 18px;border:0;border-radius:5px;cursor:pointer;font-size:15px}#corrigir{background:#333;color:white}#resetar{background:#ddd;color:#222}@media(max-width:600px){#exercicios-scroll{height:calc(100vh - 160px)}.answer-input{width:100%}.answer-btn{margin:8px 0 0}}
</style>
</head>
<body>
<header class="site-header"><nav class="nav"><a class="brand" href="../index.html">Alemão <small>estudos</small></a><div class="nav-links"><a href="../index.html#conteudos">Conteúdos</a><a href="../index.html#exercicios">Exercícios</a></div></nav></header>
<main class="container"><div class="breadcrumb"><a href="../index.html">Início</a> / Exercícios</div><div class="hero"><div class="eyebrow">Exercício</div><h1>Wechselpräpositionen</h1><p class="lead">Pratique localização, movimento e direção com as Wechselpräpositionen. Responda sem consultar o gabarito.</p></div>
<div class="panel" id="panel"><div class="progress"><span></span></div><div id="exercicios-scroll"><div id="exercicios"></div><div id="pontuacao" class="score"></div><button type="button" id="maisExercicios">Exibir mais 10</button><div id="fimLista"></div></div><div class="controls"><button type="button" id="corrigir">Corrigir</button><button type="button" id="resetar">Resetar</button></div></div></main>
<footer class="site-footer"><div class="footer-inner"><span>Material de estudo pessoal</span><a href="../index.html">← Início</a></div></footer>
<script>
const exercicios=[
[1,'Localização com uma Wechselpräposition responde a qual pergunta?','Wo?'],[2,'Movimento ou direção para um destino responde a qual pergunta?','Wohin?'],[3,'Qual caso usamos normalmente depois de uma Wechselpräposition quando respondemos a Wo?','Dativ'],[4,'Qual caso usamos normalmente depois de uma Wechselpräposition quando respondemos a Wohin?','Akkusativ'],[5,'Complete: Das Buch liegt ___ Tisch.','auf dem'],[6,'Complete: Ich lege das Buch ___ Tisch.','auf den'],[7,'Complete: Der Mann sitzt ___ Stuhl.','auf dem'],[8,'Complete: Der Mann setzt sich ___ Stuhl.','auf den'],[9,'Complete: Das Auto steht ___ Garage.','in der'],[10,'Complete: Ich stelle das Auto ___ Garage.','in die'],[11,'Complete: Die Lampe hängt ___ Wand.','an der'],[12,'Complete: Sie hängt die Lampe ___ Wand.','an die'],[13,'Complete: Der Hund liegt ___ Sofa.','auf dem'],[14,'Complete: Der Hund springt ___ Sofa.','auf das'],[15,'Complete: Die Schuhe stehen ___ Bett.','unter dem'],[16,'Complete: Ich stelle die Schuhe ___ Bett.','unter das'],[17,'Complete: Der Schrank steht ___ Fenster.','neben dem'],[18,'Complete: Ich stelle den Schrank ___ Fenster.','neben das'],[19,'Complete: Die Katze schläft ___ Tisch.','unter dem'],[20,'Complete: Die Katze läuft ___ Tisch.','unter den'],[21,'Qual preposição completa a frase? Das Bild hängt ___ Wand.','an der'],[22,'Qual preposição completa a frase? Er hängt das Bild ___ Wand.','an die'],[23,'Qual preposição completa a frase? Der Schlüssel liegt ___ Tasche.','in der'],[24,'Qual preposição completa a frase? Ich lege den Schlüssel ___ Tasche.','in die'],[25,'Qual preposição completa a frase? Die Kinder spielen ___ Garten.','in dem'],[26,'Qual preposição completa a frase? Die Kinder gehen ___ Garten.','in den'],[27,'Qual caso aparece em: Die Tasche liegt auf dem Stuhl?','Dativ'],[28,'Qual caso aparece em: Ich lege die Tasche auf den Stuhl?','Akkusativ'],[29,'Qual caso aparece em: Der Vogel sitzt auf dem Baum?','Dativ'],[30,'Qual caso aparece em: Der Vogel fliegt auf den Baum?','Akkusativ'],[31,'Traduza: O livro está sobre a mesa.','Das Buch liegt auf dem Tisch.'],[32,'Traduza: Eu coloco o livro sobre a mesa.','Ich lege das Buch auf den Tisch.'],[33,'Traduza: A cadeira está ao lado da cama.','Der Stuhl steht neben dem Bett.'],[34,'Traduza: Eu coloco a cadeira ao lado da cama.','Ich stelle den Stuhl neben das Bett.'],[35,'Traduza: O carro está na frente da casa.','Das Auto steht vor dem Haus.'],[36,'Traduza: Ele coloca o carro na frente da casa.','Er stellt das Auto vor das Haus.'],[37,'Traduza: O gato está atrás do sofá.','Die Katze ist hinter dem Sofa.'],[38,'Traduza: O gato vai para trás do sofá.','Die Katze geht hinter das Sofa.'],[39,'Traduza: A bicicleta está entre a casa e a garagem.','Das Fahrrad steht zwischen dem Haus und der Garage.'],[40,'Traduza: Ele coloca a bicicleta entre a casa e a garagem.','Er stellt das Fahrrad zwischen das Haus und die Garage.'],[41,'Transforme para indicar localização: Ich lege das Buch auf den Tisch.','Das Buch liegt auf dem Tisch.'],[42,'Transforme para indicar ação/direção: Das Buch liegt auf dem Tisch.','Ich lege das Buch auf den Tisch.'],[43,'Transforme para indicar localização: Ich stelle die Flasche auf den Tisch.','Die Flasche steht auf dem Tisch.'],[44,'Transforme para indicar ação/direção: Die Flasche steht auf dem Tisch.','Ich stelle die Flasche auf den Tisch.'],[45,'Complete: Der Mann sitzt ___ Sofa, aber er setzt sich später ___ Sessel.','auf dem / in den'],[46,'Complete: Die Lampe hängt ___ Decke, und ich hänge eine zweite Lampe ___ Decke.','an der / an die'],[47,'Complete: Das Kind ist ___ Zimmer, dann läuft es ___ Küche.','in dem / in die'],[48,'Complete: Der Teppich liegt ___ Tisch, und sie legt ihn ___ Tisch.','unter dem / unter den'],[49,'Traduza: O quadro está na parede, mas ela o pendura em outra parede.','Das Bild hängt an der Wand, aber sie hängt es an eine andere Wand.'],[50,'Traduza: O homem está sentado na cadeira e coloca o livro sobre a mesa.','Der Mann sitzt auf dem Stuhl und legt das Buch auf den Tisch.']
];

const quantidadePorPagina=10;let quantidadeExibida=0;let exerciciosEmbaralhados=[];
function embaralhar(array){const copia=[...array];for(let i=copia.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copia[i],copia[j]]=[copia[j],copia[i]]}return copia}
function normalizar(texto){return texto.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function criarQuestao(item, numeroExibicao){const [,enunciado,respostaCorreta]=item;const questao=document.createElement('div');questao.className='question';questao.dataset.indiceArray=exerciciosEmbaralhados.indexOf(item);
const prompt=document.createElement('div');prompt.className='prompt';prompt.appendChild(document.createTextNode(`${numeroExibicao}. ${enunciado}`));
const botaoResposta=document.createElement('button');botaoResposta.type='button';botaoResposta.className='answer-btn';botaoResposta.textContent='Ver resposta';
const respostaDiv=document.createElement('div');respostaDiv.className='correct-answer';respostaDiv.textContent=`Resposta: ${respostaCorreta}`;
botaoResposta.addEventListener('click',()=>{respostaDiv.classList.toggle('visible');botaoResposta.textContent=respostaDiv.classList.contains('visible')?'Ocultar resposta':'Ver resposta'});prompt.appendChild(botaoResposta);
const input=document.createElement('input');input.className='answer-input';input.type='text';input.autocomplete='off';input.placeholder='Escreva sua resposta...';
const feedback=document.createElement('div');feedback.className='feedback';questao.append(prompt,input,feedback,respostaDiv);return questao}
function exibirMais(){const container=document.getElementById('exercicios');const fim=Math.min(quantidadeExibida+quantidadePorPagina,exerciciosEmbaralhados.length);for(let i=quantidadeExibida;i<fim;i++)container.appendChild(criarQuestao(exerciciosEmbaralhados[i],i+1));quantidadeExibida=fim;atualizarPaginacao()}
function atualizarPaginacao(){const botao=document.getElementById('maisExercicios');const fim=document.getElementById('fimLista');const terminou=quantidadeExibida>=exerciciosEmbaralhados.length;botao.disabled=terminou;fim.textContent=terminou?'A lista de exercícios chegou ao fim.':''}
function corrigir(){let acertos=0;const questoes=document.querySelectorAll('.question');questoes.forEach(questao=>{const indice=Number(questao.dataset.indiceArray);const item=exerciciosEmbaralhados[indice];const input=questao.querySelector('.answer-input');const feedback=questao.querySelector('.feedback');const correta=normalizar(input.value)===normalizar(item[2]);input.style.borderColor=correta?'#4caf50':'#e05252';feedback.textContent=correta?'✓ Correto':'✗';feedback.className=`feedback ${correta?'correct':'incorrect'}`;if(correta)acertos++});const score=document.getElementById('pontuacao');score.textContent=`Resultado: ${acertos} de ${questoes.length} questões corretas.`;score.style.display='block'}
function resetar(){document.getElementById('exercicios').innerHTML='';document.getElementById('pontuacao').textContent='';document.getElementById('pontuacao').style.display='none';quantidadeExibida=0;exibirMais()}
document.getElementById('corrigir').addEventListener('click',corrigir);document.getElementById('resetar').addEventListener('click',resetar);document.getElementById('maisExercicios').addEventListener('click',exibirMais);exerciciosEmbaralhados=embaralhar(exercicios);exibirMais();
</script>
</body></html>
