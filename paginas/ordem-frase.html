<!doctype html>

<head>

<link rel="stylesheet" href="../css/style.css">
<style>
.exercicios{display:flex;flex-direction:column;gap:12px}.questao{padding:14px;border:1px solid #ddd;border-radius:8px;background:#fafafa}.enunciado{margin-bottom:10px}.campo{width:100%;padding:9px;border:1px solid #aaa;border-radius:5px;font-size:16px}.resultado{display:inline-block;margin-left:8px;font-weight:bold}.resposta{display:none;margin-top:8px;padding:8px 10px;background:#f1f1f1;border-radius:5px}.resposta.visivel{display:block}.correta{border-color:#4caf50;background:#eef9ef}.incorreta{border-color:#e05252;background:#fff0f0}.btn-resposta{padding:6px 10px;font-size:13px;background:#eee}.paginacao{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0}.paginacao button{padding:10px 16px;border:0;border-radius:5px;cursor:pointer}.paginacao button:disabled{opacity:.45;cursor:not-allowed}.fim{font-weight:bold;color:#666}.botoes{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:12px;background:#fff;border-top:1px solid #ddd;box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:1000}.botoes button{padding:10px 18px;border:0;border-radius:5px;cursor:pointer;font-size:15px}.botoes #corrigir{background:#333;color:#fff}.botoes #resetar{background:#ddd;color:#222}body{padding-bottom:80px}.progresso{font-weight:bold;margin-bottom:14px}.grupo{margin-top:24px;padding:10px 14px;background:#f5f5f5;border-radius:6px;font-weight:bold}
</style>
</head>
<body>
<header class="site-header"><nav class="nav">
<a class="brand" href="../index.html">Alemão <small>estudos</small></a>
<div class="nav-links"><a href="../index.html#conteudos">Conteúdos</a><a href="../index.html#exercicios">Exercícios</a></div>
</nav></header>
<main class="container">
<div class="breadcrumb"><a href="../index.html">Início</a> / Ordem das palavras</div>
<div class="hero"><div class="eyebrow">Prática</div><h1>Ordem das palavras</h1><p class="lead">550 exercícios divididos em 11 temas. A ordem é embaralhada ao carregar a página e cada tema possui 50 exercícios.</p></div>
<div class="panel">
<div id="progresso" class="progresso"></div>
<div id="exercicios" class="exercicios"></div>
<div class="paginacao"><button id="mais" type="button">Exibir mais 10</button><span id="fim" class="fim"></span></div>
</div>
<div class="botoes"><button id="corrigir" type="button">Corrigir</button><button id="resetar" type="button">Resetar</button></div>
</main>
<script>
const temas = [
{nome:'1. O verbo conjugado na oração principal', tipo:'posicao2', itens:[
 ['Ich','gehe','heute zur Arbeit.','Ich gehe heute zur Arbeit.'],['Heute','lerne','ich Deutsch.','Heute lerne ich Deutsch.'],['Morgen','arbeitet','er im Büro.','Morgen arbeitet er im Büro.'],['Am Montag','besucht','sie ihre Mutter.','Am Montag besucht sie ihre Mutter.'],['Nach der Schule','spielt','das Kind im Garten.','Nach der Schule spielt das Kind im Garten.']
]},
{nome:'2. A regra TeKaMoLo', tipo:'tekamolo', itens:[
 ['ich','heute','wegen des Wetters','mit dem Bus','nach Berlin'],['wir','morgen','wegen des Regens','mit dem Zug','nach München'],['sie','am Samstag','aus beruflichen Gründen','mit dem Auto','nach Hamburg'],['er','heute Abend','wegen seiner Arbeit','sehr schnell','nach Hause'],['ich','nächste Woche','wegen des Kurses','mit meiner Freundin','in die Stadt']
]},
{nome:'3. Tempo', tipo:'tempo', itens:[
 ['heute','lerne ich Deutsch.','Ich lerne heute Deutsch.'],['morgen','arbeitet er im Büro.','Morgen arbeitet er im Büro.'],['am Montag','besuchen wir unsere Großeltern.','Am Montag besuchen wir unsere Großeltern.'],['jeden Abend','liest sie ein Buch.','Jeden Abend liest sie ein Buch.'],['nächste Woche','fahren wir nach Berlin.','Nächste Woche fahren wir nach Berlin.']
]},
{nome:'4. Lugar e direção', tipo:'lugar', itens:[
 ['Ich arbeite heute','im Büro.','Ich arbeite heute im Büro.'],['Wir fahren morgen mit dem Zug','nach München.','Wir fahren morgen mit dem Zug nach München.'],['Sie geht am Montag','zur Schule.','Sie geht am Montag zur Schule.'],['Der Hund schläft','im Garten.','Der Hund schläft im Garten.'],['Er fährt heute','zum Bahnhof.','Er fährt heute zum Bahnhof.']
]},
{nome:'5. Sujeito e objeto', tipo:'objeto', itens:[
 ['Der Mann','kauft','einen Computer.','Der Mann kauft einen Computer.'],['Die Frau','liest','das Buch.','Die Frau liest das Buch.'],['Das Kind','öffnet','die Tür.','Das Kind öffnet die Tür.'],['Der Student','schreibt','einen Brief.','Der Student schreibt einen Brief.'],['Meine Schwester','trinkt','den Kaffee.','Meine Schwester trinkt den Kaffee.']
]},
{nome:'6. Elemento na primeira posição', tipo:'primeira', itens:[
 ['Heute','gehe ich zur Schule.','Heute gehe ich zur Schule.'],['Morgen','arbeitet er zu Hause.','Morgen arbeitet er zu Hause.'],['In Berlin','wohnt mein Bruder.','In Berlin wohnt mein Bruder.'],['Das Buch','lese ich heute.','Das Buch lese ich heute.'],['Nach der Arbeit','fahre ich nach Hause.','Nach der Arbeit fahre ich nach Hause.']
]},
{nome:'7. Verbos separáveis', tipo:'separavel', itens:[
 ['Ich','stehe','jeden Morgen um sieben Uhr','auf.','Ich stehe jeden Morgen um sieben Uhr auf.'],['Heute','kauft','sie im Supermarkt','ein.','Heute kauft sie im Supermarkt ein.'],['Wir','rufen','unsere Mutter','an.','Wir rufen unsere Mutter an.'],['Er','räumt','sein Zimmer','auf.','Er räumt sein Zimmer auf.'],['Am Abend','sieht','sie einen Film','an.','Am Abend sieht sie einen Film an.']
]},
{nome:'8. Verbos modais', tipo:'modal', itens:[
 ['Ich','muss','heute arbeiten.','Ich muss heute arbeiten.'],['Morgen','kann','er zu Hause bleiben.','Morgen kann er zu Hause bleiben.'],['Wir','wollen','am Wochenende reisen.','Wir wollen am Wochenende reisen.'],['Sie','möchte','einen Kaffee trinken.','Sie möchte einen Kaffee trinken.'],['Du','sollst','mehr Wasser trinken.','Du sollst mehr Wasser trinken.']
]},
{nome:'9. Perfekt e outros tempos compostos', tipo:'compostos', itens:[
 ['Ich','habe','gestern Deutsch gelernt.','Ich habe gestern Deutsch gelernt.'],['Heute','bin','ich früh aufgestanden.','Heute bin ich früh aufgestanden.'],['Wir','haben','am Wochenende gearbeitet.','Wir haben am Wochenende gearbeitet.'],['Morgen','werde','ich Deutsch lernen.','Morgen werde ich Deutsch lernen.'],['Sie','wird','nächste Woche nach Berlin fahren.','Sie wird nächste Woche nach Berlin fahren.']
]},
{nome:'10. Orações subordinadas', tipo:'subordinada', itens:[
 ['weil','ich krank bin.','Ich bleibe zu Hause, weil ich krank bin.'],['dass','er heute arbeitet.','Ich weiß, dass er heute arbeitet.'],['wenn','ich Zeit habe.','Ich komme morgen, wenn ich Zeit habe.'],['weil','sie keine Zeit hat.','Sie kommt nicht, weil sie keine Zeit hat.'],['obwohl','es regnet.','Wir gehen spazieren, obwohl es regnet.']
]},
{nome:'11. Perguntas', tipo:'pergunta', itens:[
 ['Kommst','du morgen?','Kommst du morgen?'],['Wann','kommst du?','Wann kommst du?'],['Wo','wohnst du?','Wo wohnst du?'],['Warum','lernst du Deutsch?','Warum lernst du Deutsch?'],['Arbeitet','er heute?','Arbeitet er heute?']
]}
];

function embaralhar(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gerarExercicios(){
 const saida=[];let id=0;
 for(const tema of temas){
  for(let r=0;r<10;r++){
   for(let i=0;i<5;i++){
    const d=tema.itens[i]; let enunciado='', resposta='';
    if(tema.tipo==='posicao2'){enunciado=`Organize corretamente: ${[d[2],d[1],d[0]].join(' ')}`;resposta=d[3]}
    if(tema.tipo==='tekamolo'){enunciado=`Organize os elementos segundo TeKaMoLo: ${[d[0],d[4],d[2],d[1],d[3]].join(' / ')}`;resposta=`${d[0]} ${d[1]} ${d[2]} ${d[3]} ${d[4]}.`}
    if(tema.tipo==='tempo'){enunciado=`Coloque o elemento temporal na primeira posição: ${d[1]}`;resposta=d[2]}
    if(tema.tipo==='lugar'){enunciado=`Coloque o complemento de lugar no final: ${d[0]} ___`;resposta=d[2]}
    if(tema.tipo==='objeto'){enunciado=`Monte a frase: ${d[2]} / ${d[0]} / ${d[1]}`;resposta=d[3]}
    if(tema.tipo==='primeira'){enunciado=`Reescreva começando com: "${d[0]}". Frase-base: ${d[1]}`;resposta=d[2]}
    if(tema.tipo==='separavel'){enunciado=`Complete a frase com o prefixo separável no lugar correto: ${d[0]} ${d[1]} ${d[2]} ___`;resposta=d[3]}
    if(tema.tipo==='modal'){enunciado=`Complete: ${d[0]} ${d[1]} ___`;resposta=d[2]}
    if(tema.tipo==='compostos'){enunciado=`Complete corretamente o tempo verbal: ${d[0]} ___ ${d[2]}`;resposta=d[1]}
    if(tema.tipo==='subordinada'){enunciado=`Complete a oração subordinada: ${d[2].replace(d[1],'___'+d[1])}`;resposta=d[0]}
    if(tema.tipo==='pergunta'){enunciado=`Monte a pergunta: ${d[1]} / ${d[0]}`;resposta=d[2]}
    saida.push({id:++id,tema:tema.nome,enunciado,resposta});
   }
  }
 }
 return saida;
}

const banco=gerarExercicios();let exercicios=embaralhar(banco),exibidos=10;
function render(){const c=document.getElementById('exercicios');c.innerHTML='';exercicios.slice(0,exibidos).forEach((q,i)=>{const card=document.createElement('div');card.className='questao';card.dataset.id=q.id;card.innerHTML=`<div class="enunciado"><strong>${i+1}.</strong> ${q.enunciado}</div><input class="campo" type="text" autocomplete="off"><span class="resultado"></span> <button class="btn-resposta" type="button">Ver resposta</button><div class="resposta">${q.resposta}</div>`;c.appendChild(card);});document.getElementById('progresso').textContent=`Exibindo ${Math.min(exibidos,exercicios.length)} de ${exercicios.length} exercícios.`;const btn=document.getElementById('mais');btn.disabled=exibidos>=exercicios.length;document.getElementById('fim').textContent=btn.disabled?'A lista de exercícios chegou ao fim.':'';}
function normalizar(s){return s.trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ')}
function corrigir(){let acertos=0;document.querySelectorAll('.questao').forEach(q=>{const dados=exercicios.find(x=>x.id===Number(q.dataset.id));const input=q.querySelector('.campo');const resultado=q.querySelector('.resultado');const ok=normalizar(input.value)===normalizar(dados.resposta);q.classList.remove('correta','incorreta');if(ok){q.classList.add('correta');resultado.textContent='✓ Correto';resultado.style.color='#2e7d32';acertos++}else{q.classList.add('incorreta');resultado.textContent='✗';resultado.style.color='#c62828'}});document.getElementById('progresso').textContent=`Resultado: ${acertos} de ${document.querySelectorAll('.questao').length} questões corretas.`}

document.getElementById('mais').addEventListener('click',()=>{exibidos=Math.min(exibidos+10,exercicios.length);render()});document.getElementById('corrigir').addEventListener('click',corrigir);document.getElementById('resetar').addEventListener('click',()=>{exercicios=embaralhar(banco);exibidos=10;render()});document.getElementById('exercicios').addEventListener('click',e=>{if(e.target.classList.contains('btn-resposta'))e.target.nextElementSibling.classList.toggle('visivel')});render();
</script>
</body>
</html>
