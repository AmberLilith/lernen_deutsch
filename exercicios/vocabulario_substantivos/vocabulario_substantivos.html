<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vocabulário acumulado · Alemão</title>
    <link rel="stylesheet" href="../vocabulario_substantivos/vocabulario_substantivos.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<header class="site-header">
    <nav class="nav">
        <a class="brand" href="../../index.html">Alemão <small>estudos</small></a>
        <div class="nav-links"><a href="../../index.html#conteudos">Conteúdos</a><a href="../../index.html#exercicios">Exercícios</a></div>
    </nav>
</header>
<main class="container">
    <div class="breadcrumb"><a href="../../index.html">Início</a> / Exercícios</div>
    <div class="hero">
        <div class="eyebrow">Exercício</div>
        <h1>Artigos e plurais em alemão</h1>
        <p class="lead">Selecione o artigo correto, escreva o substantivo em alemão e informe o plural.</p>
    </div>
    <div class="panel" id="panel">
        <div class="progress"><span></span></div>
        <div id="exercicios-scroll">
            <div id="exercicios"></div>
            <div id="pontuacao" class="score"></div>
            <button type="button" id="maisExercicios">Exibir mais 10</button>
            <div id="fimLista"></div>
            <div class="controls"><button class="primary" type="button" id="corrigir">Corrigir</button><button class="secondary" type="button" id="resetar">Resetar</button></div>
        </div>
    </div>
</main>
<footer class="site-footer"><div class="footer-inner"><span>Material de estudo pessoal</span><a href="../../index.html">← Início</a></div></footer>
<script src="../../js/vocabulario_substantivos.js"></script>
<script>
let exerciciosAtuais=[];
let quantidadeExibida=0;
const quantidadePorPagina=10;

function embaralhar(array){
 const copia=[...array];
 for(let i=copia.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [copia[i],copia[j]]=[copia[j],copia[i]];
 }
 return copia;
}

function criarQuestao(item,indice){
 const [substantivo,artigoCorreto,pluralCorreto,traducao]=item;
 const questao=document.createElement("div");
 questao.className="questao";
 questao.dataset.indice=indice;
 const numero=document.createElement("strong");
 numero.textContent=`${indice+1} `;
 const select=document.createElement("select");
 select.className="artigo";
 select.setAttribute("aria-label",`Artigo da questão ${indice+1}`);
 const opcaoVazia=document.createElement("option");
 opcaoVazia.value="";
 opcaoVazia.textContent="Artigo";
 opcaoVazia.selected=true;
 select.appendChild(opcaoVazia);
 ["der","die","das"].forEach(artigo=>{
  const option=document.createElement("option");
  option.value=artigo;
  option.textContent=artigo;
  select.appendChild(option);
 });
 const inputSubstantivo=document.createElement("input");
 inputSubstantivo.type="text";
 inputSubstantivo.className="substantivo";
 inputSubstantivo.autocomplete="off";
 inputSubstantivo.placeholder=`${traducao} no singular`;
 const textoPortugues=document.createTextNode(` (${traducao}). `);
 const labelPlural=document.createElement("span");
 labelPlural.textContent="Plural: ";
 const inputPlural=document.createElement("input");
 inputPlural.type="text";
 inputPlural.className="plural";
 inputPlural.autocomplete="off";
 inputPlural.placeholder=`${traducao} no plural`;
 const resultado=document.createElement("span");
 resultado.className="resultado";
 const botaoResposta=document.createElement("button");
 botaoResposta.type="button";
 botaoResposta.className="btn-resposta";
 botaoResposta.textContent="Ver resposta";
 const resposta=document.createElement("div");
 resposta.className="resposta";
 resposta.textContent=`Resposta: ${artigoCorreto} ${substantivo} (${traducao}). Plural: ${pluralCorreto}`;
 botaoResposta.addEventListener("click",()=>{
  resposta.classList.toggle("visivel");
  botaoResposta.textContent=resposta.classList.contains("visivel")?"Ocultar resposta":"Ver resposta";
 });
 questao.append(numero,textoPortugues,select,inputSubstantivo,labelPlural,inputPlural,resultado,botaoResposta,resposta);
 return questao;
}

function exibirMaisExercicios(){
 const container=document.getElementById("exercicios");
 const proximaQuantidade=Math.min(quantidadeExibida+quantidadePorPagina,exerciciosAtuais.length);
 for(let indice=quantidadeExibida;indice<proximaQuantidade;indice++) container.appendChild(criarQuestao(exerciciosAtuais[indice],indice));
 quantidadeExibida=proximaQuantidade;
 atualizarBotaoMais();
}

function atualizarBotaoMais(){
 const botao=document.getElementById("maisExercicios");
 const mensagemFim=document.getElementById("fimLista");
 if(quantidadeExibida>=exerciciosAtuais.length){
  botao.disabled=true;
  mensagemFim.style.color="#940606";
  mensagemFim.textContent="A lista de palavras chegou ao fim.";
 }else{
  botao.disabled=false;
  mensagemFim.textContent="";
 }
}

function criarExercicios(){
 document.getElementById("exercicios").innerHTML="";
 const pontuacao=document.getElementById("pontuacao");
 pontuacao.textContent="";
 pontuacao.style.display="none";
 quantidadeExibida=0;
 exerciciosAtuais=embaralhar(lista);
 exibirMaisExercicios();
}

function compararResposta(resposta,correta){
 return resposta.trim()===correta;
}

function marcarCampo(elemento,correta){
 elemento.classList.remove("campo-correto","campo-incorreto");
 elemento.classList.add(correta?"campo-correto":"campo-incorreto");
}

function corrigir(){
 let acertos=0;
 document.querySelectorAll(".questao").forEach(questao=>{
  const indice=Number(questao.dataset.indice);
  const [substantivo,artigo,plural]=exerciciosAtuais[indice];
  const selectArtigo=questao.querySelector(".artigo");
  const inputSubstantivo=questao.querySelector(".substantivo");
  const inputPlural=questao.querySelector(".plural");
  const artigoOk=selectArtigo.value===artigo;
  const substantivoOk=compararResposta(inputSubstantivo.value,substantivo);
  const pluralOk=compararResposta(inputPlural.value,plural);
  const totalOk=artigoOk&&substantivoOk&&pluralOk;
  marcarCampo(selectArtigo,artigoOk);
  marcarCampo(inputSubstantivo,substantivoOk);
  marcarCampo(inputPlural,pluralOk);
  questao.classList.remove("correta","incorreta");
  questao.classList.add(totalOk?"correta":"incorreta");
  if(totalOk) acertos++;
 });
 const total=document.querySelectorAll(".questao").length;
 const pontuacao=document.getElementById("pontuacao");
 pontuacao.textContent=`Resultado: ${acertos} de ${total} questões corretas.`;
 pontuacao.style.display="block";
}

document.getElementById("corrigir").addEventListener("click",corrigir);
document.getElementById("maisExercicios").addEventListener("click",exibirMaisExercicios);
document.getElementById("resetar").addEventListener("click",criarExercicios);
criarExercicios();
</script>
</body>
</html>
