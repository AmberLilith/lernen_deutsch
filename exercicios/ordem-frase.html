<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordem das palavras · Alemão</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.exercise-grid{display:flex;flex-direction:column;gap:10px}.exercise{padding:14px;border:1px solid #ddd;border-radius:8px;background:#fafafa}.exercise strong{display:block;margin-bottom:8px}.exercise small{color:#666}.answer{display:none;margin-top:8px;color:#555}.answer.visible{display:block}.btn-answer{margin-top:8px;padding:7px 10px}.pagination{display:flex;gap:10px;justify-content:center;margin:20px 0}.fixed-actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;gap:10px;justify-content:center;z-index:1000}.score{font-weight:bold;margin-top:15px}.correct{border-color:#4caf50;background:#eef9ef}.wrong{border-color:#e05252;background:#fff0f0}body{padding-bottom:75px}
</style>
</head>
<body>
<header class="site-header"><nav class="nav"><a class="brand" href="../index.html">Alemão <small>estudos</small></a><div class="nav-links"><a href="../index.html#conteudos">Conteúdos</a><a href="../index.html#exercicios">Exercícios</a></div></nav></header>
<main class="container">
<div class="breadcrumb"><a href="../index.html">Início</a> / Exercícios / Ordem das palavras</div>
<div class="hero"><div class="eyebrow">Exercícios</div><h1>Ordem das palavras</h1><p class="lead">Pratique a posição do verbo, TeKaMoLo, inversão, verbos separáveis, modais, tempos compostos, subordinadas e perguntas.</p></div>
<div class="panel"><div id="exercicios" class="exercise-grid"></div><div id="pontuacao" class="score"></div><div class="pagination"><button id="mais" type="button">Exibir mais 10</button><span id="fim"></span></div></div>
</main>
<div class="fixed-actions"><button id="corrigir" type="button">Corrigir</button><button id="resetar" type="button">Resetar</button></div>
<script>
const exercicios = [];
const adicionar = (tema, tipo, enunciado, resposta) => exercicios.push({tema,tipo,enunciado,resposta,id:exercicios.length});

const verbos=[['Ich ___ jeden Tag Deutsch.','lerne','lernen'],['Heute ___ Maria im Büro.','arbeitet','arbeiten'],['Morgen ___ wir nach Berlin.','fahren','fahren'],['Der Mann ___ ein Buch.','liest','lesen'],['Die Kinder ___ im Park.','spielen','spielen'],['Am Abend ___ ich zu Hause.','bleibe','bleiben'],['Peter ___ einen Kaffee.','trinkt','trinken'],['Wir ___ heute früh.','beginnen','beginnen'],['Sie ___ ihre Mutter.','besucht','besuchen'],['Du ___ sehr schnell.','läufst','laufen'],['Ich ___ morgen zum Arzt.','gehe','gehen'],['Er ___ jeden Morgen.','arbeitet','arbeiten'],['Heute ___ die Frau einen Kuchen.','backt','backen'],['Wir ___ am Samstag Freunde.','treffen','treffen'],['Das Kind ___ im Bett.','schläft','schlafen'],['Ich ___ die Tür.','öffne','öffnen'],['Sie ___ das Fenster.','schließt','schließen'],['Der Student ___ viel.','lernt','lernen'],['Ihr ___ sehr laut.','sprecht','sprechen'],['Wir ___ zusammen.','wohnen','wohnen']];
verbos.forEach((x,i)=>adicionar('O verbo conjugado na oração principal','lacuna',`Complete: ${x[0]} (${x[2]})`,x[1]));

const tekamolo=[
['Ich fahre ___ mit dem Bus nach Berlin.','heute wegen des Regens','hoje por causa da chuva'],['Wir arbeiten ___ mit dem Computer im Büro.','heute wegen des Projekts','hoje por causa do projeto'],['Sie fährt ___ mit dem Zug nach München.','morgen wegen des Wetters','amanhã por causa do tempo'],['Er bleibt ___ ruhig zu Hause.','heute wegen der Krankheit','hoje por causa da doença'],['Ich lerne ___ mit meiner Freundin in der Bibliothek.','am Abend wegen der Prüfung','à noite por causa da prova'],['Wir gehen ___ zu Fuß zur Schule.','jeden Morgen wegen des Verkehrs','todas as manhãs por causa do trânsito'],['Sie arbeitet ___ mit großer Freude im Garten.','am Samstag wegen des schönen Wetters','no sábado por causa do bom tempo'],['Er fährt ___ mit dem Fahrrad zur Arbeit.','jeden Tag wegen der Gesundheit','todos os dias por causa da saúde'],['Ich bleibe ___ mit meiner Familie zu Hause.','am Sonntag wegen des Regens','no domingo por causa da chuva'],['Wir fahren ___ mit dem Auto zum Bahnhof.','morgen wegen des frühen Zuges','amanhã por causa do trem cedo']];
tekamolo.forEach(x=>adicionar('A regra TeKaMoLo','lacuna',`Complete na ordem TeKaMoLo: Ich/Wir/Sie/Er... (${x[2]})`,x[1]));

const tempos=[['Ich ___ heute Deutsch.','heute','hoje'],['Wir ___ morgen nach Hause.','morgen','amanhã'],['Sie arbeitet ___.','am Montag','na segunda-feira'],['Er kommt ___.','am Abend','à noite'],['Ich besuche meine Mutter ___.','am Wochenende','no fim de semana'],['Wir lernen ___.','jeden Morgen','todas as manhãs'],['Sie fährt ___.','nächste Woche','na próxima semana'],['Er arbeitet ___.','seit einem Jahr','há um ano'],['Ich war ___.','gestern','ontem'],['Wir treffen uns ___.','um acht Uhr','às oito horas']];
tempos.forEach(x=>adicionar('Tempo','lacuna',`Complete com o elemento temporal: ${x[0]} (${x[2]})`,x[1]));

const lugares=[['Er fährt heute ___.','zur Arbeit','ao trabalho'],['Wir gehen morgen ___.','in die Schule','para a escola'],['Sie wohnt ___.','in Berlin','em Berlim'],['Das Kind spielt ___.','im Garten','no jardim'],['Ich arbeite ___.','im Büro','no escritório'],['Er fährt ___.','zum Bahnhof','à estação'],['Wir essen ___.','im Restaurant','no restaurante'],['Sie wartet ___.','vor dem Haus','em frente à casa'],['Das Auto steht ___.','hinter dem Haus','atrás da casa'],['Ich gehe ___.','in die Apotheke','à farmácia']];
lugares.forEach(x=>adicionar('Lugar e direção','lacuna',`Coloque o complemento de lugar no final: ${x[0]} (${x[2]})`,x[1]));

const sujeitoObjeto=[['___ kauft einen Computer.','Der Mann','O homem'],['Ich gebe ___ das Buch.','dem Kind','à criança'],['___ liest heute die Zeitung.','Meine Schwester','Minha irmã'],['Wir besuchen ___.','unsere Großeltern','nossos avós'],['___ sieht den Hund.','Der Junge','O menino'],['Ich helfe ___.','meinem Bruder','meu irmão'],['___ kauft die Mutter.','das Brot','o pão'],['Sie gibt ___ einen Kaffee.','dem Chef','ao chefe'],['___ besucht den Lehrer.','der Student','o estudante'],['Ich sehe ___.','den Vogel','o pássaro']];
sujeitoObjeto.forEach(x=>adicionar('Sujeito e objeto','lacuna',`Complete: ${x[0]} (${x[2]})`,x[1]));

const primeira=[['___ gehe ich zur Arbeit.','Heute','hoje'],['___ fährt er nach Berlin.','Morgen','amanhã'],['___ wohnt meine Schwester.','In München','em Munique'],['___ lese ich am Abend.','Das Buch','o livro'],['___ besucht sie ihre Mutter.','Am Sonntag','no domingo'],['___ arbeitet mein Bruder.','Im Büro','no escritório'],['___ kaufe ich ein.','Nach der Arbeit','depois do trabalho'],['___ gehen wir nach Hause.','Um acht Uhr','às oito horas'],['___ steht das Auto.','Vor dem Haus','em frente à casa'],['___ lernt der Student Deutsch.','Jeden Abend','todas as noites']];
primeira.forEach(x=>adicionar('Elemento na primeira posição','lacuna',`Coloque o elemento na primeira posição: ${x[0]} (${x[2]})`,x[1]));

const separaveis=[['Ich ___ jeden Morgen um sieben Uhr ___.','stehe;auf','levanto-me'],['Heute ___ sie im Supermarkt ___.','kauft;ein','faz compras'],['Er ___ das Fenster ___.','macht;auf','abre'],['Wir ___ am Abend ___.','sehen;fern','assistimos à televisão'],['Du ___ morgen früh ___.','stehst;auf','levanta-se'],['Ich ___ meine Freunde ___.','rufe;an','telefono para'],['Sie ___ ihre Jacke ___.','zieht;an','veste'],['Der Zug ___ um acht Uhr ___.','fährt;ab','parte'],['Wir ___ das Licht ___.','machen;aus','apagamos'],['Er ___ die Tür ___.','schließt;ab','fecha']];
separaveis.forEach(x=>adicionar('Verbos separáveis','lacuna',`Complete: ${x[0]} (${x[2]})`,x[1]));

const modais=[['Ich muss ___ .','heute arbeiten','trabalhar hoje'],['Du sollst ___ .','mehr Wasser trinken','tomar mais água'],['Wir können ___ .','morgen kommen','poder vir amanhã'],['Er will ___ .','ein neues Auto kaufen','comprar um carro novo'],['Sie darf ___ .','hier bleiben','poder ficar aqui'],['Ich möchte ___ .','Deutsch lernen','querer aprender alemão'],['Ihr müsst ___ .','jetzt gehen','ter que ir agora'],['Du kannst ___ .','mit uns kommen','poder vir conosco'],['Er soll ___ .','den Arzt anrufen','dever telefonar para o médico'],['Wir wollen ___ .','am Wochenende reisen','querer viajar no fim de semana']];
modais.forEach(x=>adicionar('Verbos modais','lacuna',`Complete: ${x[0]} (${x[2]})`,x[1]));

const temposCompostos=[['Wir ___ am Wochenende gearbeitet.','haben','Perfekt'],['Ich ___ gestern nach Hause gegangen.','bin','Perfekt'],['Sie ___ heute Deutsch gelernt.','hat','Perfekt'],['Er ___ früh aufgestanden.','ist','Perfekt'],['Wir ___ morgen arbeiten.','werden','Futur I'],['Ich ___ nächste Woche reisen.','werde','Futur I'],['Sie ___ bald kommen.','wird','Futur I'],['Ihr ___ später lernen.','werdet','Futur I'],['Er ___ gestern Fußball gespielt.','hat','Perfekt'],['Wir ___ am Montag angekommen.','sind','Perfekt']];
temposCompostos.forEach(x=>adicionar('Perfekt e outros tempos compostos','lacuna',`Complete corretamente o tempo verbal: ${x[0]} (${x[2]})`,x[1]));

const subordinadas=[['Ich bleibe zu Hause, weil ich krank ___.','bin','estou doente'],['Ich weiß, dass er heute ___.','arbeitet','trabalha hoje'],['Wenn du Zeit hast, ___.','kommst du','você vem'],['Sie bleibt hier, weil sie warten ___.','muss','precisa esperar'],['Ich glaube, dass er morgen ___.','kommt','vem amanhã'],['Wir gehen, wenn der Regen ___.','aufhört','para'],['Er weiß, dass ich Deutsch ___.','lerne','estudo alemão'],['Sie bleibt zu Hause, weil sie krank ___.','ist','está doente'],['Wenn ich Zeit habe, ___ ich dich.','besuche','visito'],['Ich hoffe, dass du morgen ___.','kommst','vem amanhã']];
subordinadas.forEach(x=>adicionar('Orações subordinadas','lacuna',`Complete: ${x[0]} (${x[2]})`,x[1]));

const perguntas=[['___ du morgen?','Kommst','Você vem amanhã?'],['___ wohnst du?','Wo','Onde você mora?'],['___ kommst du?','Wann','Quando você vem?'],['___ lernst du Deutsch?','Warum','Por que você estuda alemão?'],['___ arbeitet er?','Wo','Onde ele trabalha?'],['___ fährt sie nach Berlin?','Wann','Quando ela vai para Berlim?'],['___ machst du heute?','Was','O que você faz hoje?'],['___ heißt du?','Wie','Como você se chama?'],['___ kommt der Zug?','Wann','Quando o trem chega?'],['___ gehst du zur Schule?','Wie','Como você vai à escola?']];
perguntas.forEach(x=>adicionar('Perguntas','lacuna',`Complete a pergunta: ${x[0]} (${x[2]})`,x[1]));

// Completa cada tema até 50 exercícios, usando variações seguras dos mesmos padrões.
const temas=[...new Set(exercicios.map(e=>e.tema))];
const modelos={
'O verbo conjugado na oração principal':['Heute ___ ich Deutsch.','Morgen ___ wir nach Hause.','Am Abend ___ er im Büro.','Jeden Tag ___ sie Deutsch.','Nach der Arbeit ___ ich nach Hause.'],
'A regra TeKaMoLo':['Ich fahre ___ nach Berlin.','Wir arbeiten ___ im Büro.','Sie lernt ___ in der Bibliothek.','Er fährt ___ zur Arbeit.','Ich bleibe ___ zu Hause.'],
'Tempo':['Ich arbeite ___.','Wir lernen ___.','Sie kommt ___.','Er fährt ___.','Ich besuche meine Mutter ___.'],
'Lugar e direção':['Er fährt heute ___.','Wir gehen morgen ___.','Sie arbeitet ___.','Das Kind spielt ___.','Ich gehe ___.'],
'Sujeito e objeto':['___ kauft das Buch.','Ich gebe ___ das Buch.','___ liest die Zeitung.','Wir besuchen ___.','Ich helfe ___.'],
'Elemento na primeira posição':['___ gehe ich zur Arbeit.','___ fährt er nach Berlin.','___ wohnt meine Schwester.','___ lese ich heute.','___ arbeitet mein Bruder.'],
'Verbos separáveis':['Ich ___ um sieben Uhr ___.','Heute ___ sie ___.','Er ___ das Fenster ___.','Wir ___ am Abend ___.','Du ___ morgen ___.'],
'Verbos modais':['Ich muss ___ .','Du sollst ___ .','Wir können ___ .','Er will ___ .','Sie darf ___ .'],
'Perfekt e outros tempos compostos':['Wir ___ gestern gearbeitet.','Ich ___ nach Hause gegangen.','Sie ___ Deutsch gelernt.','Er ___ früh aufgestanden.','Wir ___ morgen arbeiten.'],
'Orações subordinadas':['Ich bleibe zu Hause, weil ich krank ___.','Ich weiß, dass er heute ___.','Wenn du Zeit hast, ___.','Sie bleibt hier, weil sie warten ___.','Ich glaube, dass er morgen ___.'],
'Perguntas':['___ du morgen?','___ wohnst du?','___ kommst du?','___ lernst du Deutsch?','___ arbeitet er?']};
const respostas={
'O verbo conjugado na oração principal':['lerne','fahren','arbeitet','lernt','gehe'],
'A regra TeKaMoLo':['heute wegen des Regens mit dem Bus','heute wegen des Projekts mit dem Computer','am Abend mit meiner Freundin in der Bibliothek','morgen mit dem Fahrrad zur Arbeit','heute wegen des Regens zu Hause'],
'Tempo':['heute','morgen','am Montag','am Abend','am Wochenende'],
'Lugar e direção':['zur Arbeit','in die Schule','im Büro','im Garten','in die Apotheke'],
'Sujeito e objeto':['Der Mann','dem Kind','Meine Schwester','unsere Großeltern','meinem Bruder'],
'Elemento na primeira posição':['Heute','Morgen','In München','Das Buch','Im Büro'],
'Verbos separáveis':['stehe;auf','kauft;ein','macht;auf','sehen;fern','stehst;auf'],
'Verbos modais':['heute arbeiten','mehr Wasser trinken','morgen kommen','ein neues Auto kaufen','hier bleiben'],
'Perfekt e outros tempos compostos':['haben','bin','hat','ist','werden'],
'Orações subordinadas':['bin','arbeitet','kommst du','muss','kommt'],
'Perguntas':['Kommst','Wo','Wann','Warum','Wo']};
const significados={
'O verbo conjugado na oração principal':['aprendo alemão','ir para casa','trabalha no escritório','aprende alemão','vou para casa'],
'A regra TeKaMoLo':['hoje por causa da chuva de ônibus','hoje por causa do projeto com o computador','à noite com minha amiga na biblioteca','amanhã de bicicleta para o trabalho','hoje por causa da chuva em casa'],
'Tempo':['hoje','amanhã','na segunda-feira','à noite','no fim de semana'],
'Lugar e direção':['ao trabalho','para a escola','no escritório','no jardim','à farmácia'],
'Sujeito e objeto':['o homem','à criança','minha irmã','nossos avós','meu irmão'],
'Elemento na primeira posição':['hoje','amanhã','em Munique','o livro','no escritório'],
'Verbos separáveis':['levanto-me','faz compras','abre','assistimos à televisão','levanta-se'],
'Verbos modais':['trabalhar hoje','tomar mais água','poder vir amanhã','comprar um carro novo','poder ficar aqui'],
'Perfekt e outros tempos compostos':['ter','ter ido','ter aprendido','ter se levantado','Futur I'],
'Orações subordinadas':['estou doente','trabalha hoje','você vem','precisa esperar','vem amanhã'],
'Perguntas':['Você vem?','Onde você mora?','Quando você vem?','Por que você estuda alemão?','Onde ele trabalha?']};
for(const tema of temas){let n=exercicios.filter(e=>e.tema===tema).length;let i=0;while(n<50){const m=modelos[tema][i%modelos[tema].length];const r=respostas[tema][i%respostas[tema].length];const s=significados[tema][i%significados[tema].length];adicionar(tema,'lacuna',`Complete: ${m} (${s})`,r);n++;i++;}}

let ordem=[], exibidos=10;
function embaralhar(a){return [...a].sort(()=>Math.random()-.5)}
function render(){const c=document.getElementById('exercicios');c.innerHTML='';ordem.slice(0,exibidos).forEach((e,i)=>{const d=document.createElement('div');d.className='exercise';d.dataset.id=e.id;const q=document.createElement('strong');q.textContent=`${i+1}. ${e.enunciado}`;const input=document.createElement('input');input.type='text';input.className='resposta-input';input.autocomplete='off';const b=document.createElement('button');b.type='button';b.className='btn-answer';b.textContent='Ver resposta';const a=document.createElement('div');a.className='answer';a.textContent=`Resposta: ${e.resposta}`;b.onclick=()=>a.classList.toggle('visible');d.append(q,input,b,a);c.appendChild(d)});document.getElementById('mais').disabled=exibidos>=ordem.length;document.getElementById('fim').textContent=exibidos>=ordem.length?'A lista de exercícios chegou ao fim.':''}
function normalizar(s){return s.trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ')}
function corrigir(){let acertos=0;document.querySelectorAll('.exercise').forEach(d=>{const e=ordem.find(x=>x.id==d.dataset.id),input=d.querySelector('input'),ok=normalizar(input.value)===normalizar(e.resposta);d.classList.toggle('correct',ok);d.classList.toggle('wrong',!ok);if(ok)acertos++});document.getElementById('pontuacao').textContent=`Resultado: ${acertos} de ${document.querySelectorAll('.exercise').length} questões corretas.`}
document.getElementById('mais').onclick=()=>{exibidos=Math.min(exibidos+10,ordem.length);render()};document.getElementById('corrigir').onclick=corrigir;document.getElementById('resetar').onclick=()=>{ordem=embaralhar(exercicios);exibidos=10;document.getElementById('pontuacao').textContent='';render()};ordem=embaralhar(exercicios);render();
</script>
</body>
</html>
