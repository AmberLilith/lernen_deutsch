<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preposições · Alemão</title>
<link rel="stylesheet" href="../css/style.css">
<style>
#panel{position:relative}
#exercicios-scroll{height:calc(100vh - 180px);overflow-y:auto;padding-bottom:90px}
#exercicios{display:flex;flex-direction:column;gap:10px}
.question{padding:14px 16px;border-radius:6px;background:#fafafa;border:1px solid #e5e5e5}
.prompt{font-weight:600;line-height:1.6;margin-bottom:10px}
.answer-input{width:min(100%,760px);font-size:16px;padding:9px 10px;border:1px solid #aaa;border-radius:4px}
.feedback{display:inline-block;margin-left:8px;font-weight:bold}
.feedback.correct{color:#2e7d32}.feedback.incorrect{color:#c62828}
.answer-btn{margin-left:10px;padding:6px 10px;background:#eee;color:#333;border:0;border-radius:5px;cursor:pointer;font-size:13px}
.correct-answer{display:none;margin-top:8px;padding-left:2px;color:#555;font-style:italic}
.correct-answer.visible{display:block}
.part-title{margin:20px 0 8px;color:#b07100;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.12em}
#pontuacao{display:none;margin-top:18px;font-weight:bold;font-size:18px}
#maisExercicios{display:block;margin:25px auto 10px;padding:10px 18px;background:#333;color:white;border:0;border-radius:5px;cursor:pointer;font-size:15px}
#maisExercicios:disabled{background:#aaa;cursor:default}
#fimLista{text-align:center;margin-top:10px;color:#666;font-weight:bold}
.controls{position:absolute;bottom:0;left:0;width:100%;display:flex;gap:10px;padding:12px 0;background:#f4f1e8;border-top:1px solid #d8d2c4;z-index:10}
.controls button{flex:1;padding:10px 18px;border:0;border-radius:5px;cursor:pointer;font-size:15px}
#corrigir{background:#333;color:white}#resetar{background:#ddd;color:#222}
@media(max-width:600px){#exercicios-scroll{height:calc(100vh - 160px)}.answer-input{width:100%}.answer-btn{margin:8px 0 0 0}}
</style>
</head>
<body>
<header class="site-header">
<nav class="nav">
<a class="brand" href="../index.html">Alemão <small>estudos</small></a>
<div class="nav-links"><a href="../index.html#conteudos">Conteúdos</a><a href="../index.html#exercicios">Exercícios</a></div>
</nav>
</header>
<main class="container">
<div class="breadcrumb"><a href="../index.html">Início</a> / Exercícios</div>
<div class="hero"><div class="eyebrow">Exercício</div><h1>Preposições</h1><p class="lead">Traduza as frases para o alemão. A correção aparece somente depois de clicar em Corrigir.</p></div>
<div class="panel" id="panel">
<div class="progress"><span></span></div>
<div id="exercicios-scroll">
<div id="exercicios"></div>
<div id="pontuacao" class="score"></div>
<button type="button" id="maisExercicios">Exibir mais 10</button>
<div id="fimLista"></div>
</div>
<div class="controls"><button type="button" id="corrigir">Corrigir</button><button type="button" id="resetar">Resetar</button></div>
</div>
</main>
<footer class="site-footer"><div class="footer-inner"><span>Material de estudo pessoal</span><a href="../index.html">← Início</a></div></footer>
<script>
// Cada exercício fica armazenado junto com sua resposta correta.
// A lista é embaralhada antes da primeira exibição, sem alterar a lista original.
const exercicios=[
[1,'Nós fazemos isso pelo vizinho.','Wir machen das für den Nachbarn.'],
[2,'Ele caminha através da floresta.','Er geht durch den Wald.'],
[3,'Ela é contra isso.','Sie ist dagegen.'],
[4,'Eu vou sem o celular.','Ich gehe ohne das Handy.'],
[5,'Nós chegamos às 7h.','Wir kommen um 7 Uhr an.'],
[6,'Eu venho da farmácia.','Ich komme aus der Apotheke.'],
[7,'Ela mora na casa do tio.','Sie wohnt im Haus des Onkels.'],
[8,'Nós vamos com o chefe.','Wir gehen mit dem Chef.'],
[9,'Ele viaja para a Alemanha depois do trabalho.','Er reist nach Deutschland nach der Arbeit.'],
[10,'Eu moro aqui desde um ano.','Ich wohne hier seit einem Jahr.'],
[11,'Isso é do estudante.','Das ist vom Studenten.'],
[12,'Ela vai à igreja.','Sie geht in die Kirche.'],
[13,'O relógio está na mesa.','Die Uhr liegt auf dem Tisch.'],
[14,'O pássaro está na árvore. (árvore = der Baum)','Der Vogel ist auf dem Baum.'],
[15,'A lâmpada está perto da cama.','Die Lampe ist neben dem Bett.'],
[16,'O carro está na frente da loja.','Das Auto steht vor dem Laden.'],
[17,'O gato está atrás do sofá.','Die Katze ist hinter dem Sofa.'],
[18,'O tapete está debaixo da mesa.','Der Teppich liegt unter dem Tisch.'],
[19,'A lâmpada está sobre a mesa.','Die Lampe hängt über dem Tisch.'],
[20,'A cadeira está entre a cama e o armário.','Der Stuhl ist zwischen dem Bett und dem Schrank.'],
[21,'Ela coloca o relógio na mesa. (colocar, deitado = legen)','Sie legt die Uhr auf den Tisch.'],
[22,'O pássaro voa para a árvore. (voar = fliegen)','Der Vogel fliegt auf den Baum.'],
[23,'Ele coloca a lâmpada perto da cama. (colocar, de pé = stellen)','Er stellt die Lampe neben das Bett.'],
[24,'Ela estaciona o carro na frente da loja. (estacionar = parken)','Sie parkt das Auto vor dem Laden.'],
[25,'O gato vai para trás do sofá.','Die Katze geht hinter das Sofa.'],
[26,'Ele coloca o tapete debaixo da mesa.','Er legt den Teppich unter den Tisch.'],
[27,'Ela pendura a lâmpada sobre a mesa. (pendurar = hängen)','Sie hängt die Lampe über den Tisch.'],
[28,'Ele coloca a cadeira entre a cama e o armário.','Er stellt den Stuhl zwischen das Bett und den Schrank.'],
[29,'Nós estamos em casa desde a manhã.','Wir sind seit dem Morgen zu Hause.'],
[30,'Ela vai ao médico sem o celular.','Sie geht ohne das Handy zum Arzt.'],
[31,'Ele mora na casa do vizinho há um ano.','Er wohnt seit einem Jahr im Haus des Nachbarn.'],
[32,'O espelho está na parede. (parede = die Wand)','Der Spiegel hängt an der Wand.'],
[33,'Ela pendura o espelho na parede.','Sie hängt den Spiegel an die Wand.'],
[34,'Nós caminhamos através da cidade.','Wir gehen durch die Stadt.'],
[35,'Isso é para o chefe.','Das ist für den Chef.'],
[36,'Ele vem do hospital.','Er kommt aus dem Krankenhaus.'],
[37,'O sapato está debaixo da cama.','Der Schuh ist unter dem Bett.'],
[38,'Ela coloca o sapato debaixo da cama.','Sie stellt den Schuh unter das Bett.'],
[39,'Nós vamos para a farmácia com o vizinho.','Wir gehen mit dem Nachbarn zur Apotheke.'],
[40,'Ele está contra a ideia. (ideia = die Idee)','Er ist gegen die Idee.'],
[41,'Ontem eu fui ao médico sem o vizinho, porque ele estava trabalhando.','Gestern bin ich ohne den Nachbarn zum Arzt gegangen, weil er gearbeitet hat.'],
[42,'O carro está na frente da casa, e a bicicleta está atrás da casa.','Das Auto steht vor dem Haus, und das Fahrrad steht hinter dem Haus.'],
[43,'Ela pendurou o quadro na parede e colocou o tapete debaixo da mesa. (quadro = das Bild)','Sie hat das Bild an die Wand gehängt und den Teppich unter den Tisch gelegt.'],
[44,'Nós moramos na cidade desde três anos, perto do hospital.','Wir wohnen seit drei Jahren in der Stadt, in der Nähe des Krankenhauses.']
];

const quantidadePorPagina=10;
let quantidadeExibida=0;
let exerciciosEmbaralhados=[];

function embaralhar(array){
 const copia=[...array];
 for(let i=copia.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [copia[i],copia[j]]=[copia[j],copia[i]];
 }
 return copia;
}

function criarQuestao(item){
 const [numero,frase,resposta]=item;
 const questao=document.createElement('div');
 questao.className='question';
 questao.dataset.numero=numero;
 const prompt=document.createElement('div');
 prompt.className='prompt';
 prompt.append(document.createTextNode(`${numero}. ${frase}`));
 const botao=document.createElement('button');
 botao.type='button';botao.className='answer-btn';botao.textContent='Ver resposta';
 const respostaDiv=document.createElement('div');
 respostaDiv.className='correct-answer';
 respostaDiv.textContent=`Resposta: ${resposta}`;
 botao.addEventListener('click',()=>{
  respostaDiv.classList.toggle('visible');
  botao.textContent=respostaDiv.classList.contains('visible')?'Ocultar resposta':'Ver resposta';
 });
 prompt.appendChild(botao);
 const input=document.createElement('input');
 input.className='answer-input';input.type='text';input.autocomplete='off';input.placeholder='Escreva a tradução em alemão...';
 const feedback=document.createElement('div');feedback.className='feedback';
 questao.append(prompt,input,feedback,respostaDiv);
 return questao;
}

function normalizar(texto){return texto.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');}

function exibirMais(){
 const container=document.getElementById('exercicios');
 const fim=Math.min(quantidadeExibida+quantidadePorPagina,exerciciosEmbaralhados.length);
 for(let i=quantidadeExibida;i<fim;i++){
  container.appendChild(criarQuestao(exerciciosEmbaralhados[i]));
 }
 quantidadeExibida=fim;
 atualizarPaginacao();
}

function atualizarPaginacao(){
 const botao=document.getElementById('maisExercicios');
 const fim=document.getElementById('fimLista');
 const terminou=quantidadeExibida>=exerciciosEmbaralhados.length;
 botao.disabled=terminou;
 fim.textContent=terminou?'A lista de exercícios chegou ao fim.':'';
}

function corrigir(){
 let acertos=0;
 document.querySelectorAll('.question').forEach(q=>{
  const numero=Number(q.dataset.numero);
  const item=exerciciosEmbaralhados.find(x=>x[0]===numero);
  const input=q.querySelector('.answer-input');
  const feedback=q.querySelector('.feedback');
  const ok=normalizar(input.value)===normalizar(item[2]);
  input.style.borderColor=ok?'#4caf50':'#e05252';
  feedback.textContent=ok?'✓ Correto':'✗ Incorreta';
  feedback.className=`feedback ${ok?'correct':'incorrect'}`;
  if(ok) acertos++;
 });
 const total=document.querySelectorAll('.question').length;
 const score=document.getElementById('pontuacao');
 score.textContent=`Resultado: ${acertos} de ${total} questões corretas.`;
 score.style.display='block';
 const bar=document.querySelector('.progress span');
 if(bar) bar.style.width=(total?acertos/total*100:0)+'%';
}

function resetar(){
 document.getElementById('exercicios').innerHTML='';
 document.getElementById('pontuacao').style.display='none';
 document.getElementById('pontuacao').textContent='';
 document.querySelector('.progress span').style.width='0';
 quantidadeExibida=0;
 exibirMais();
}

document.getElementById('corrigir').addEventListener('click',corrigir);
document.getElementById('resetar').addEventListener('click',resetar);
document.getElementById('maisExercicios').addEventListener('click',exibirMais);

// Embaralha uma única vez ao carregar a página.
// A lista original continua intacta e cada item leva sua própria resposta.
exerciciosEmbaralhados=embaralhar(exercicios);
exibirMais();
</script>
</body>
</html>
